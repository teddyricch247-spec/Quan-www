<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7fb0e0">
<title>Blockscape</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --fc:255,240,200;--glass:rgba(12,18,30,.56);--edge:rgba(255,255,255,.2);--gold:#f2c14e;--grass:#5aa83a;--grass-d:#33701f}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#7fb0e0;color:#fff;
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body>canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* ---- HUD ---- */
#fl{position:fixed;left:0;top:0;width:620px;height:620px;margin:-310px 0 0 -310px;pointer-events:none;z-index:1;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(circle,rgba(var(--fc),.85) 0,rgba(var(--fc),.28) 12%,transparent 58%),repeating-conic-gradient(rgba(var(--fc),.16) 0 3deg,transparent 3deg 9deg);
  -webkit-mask:radial-gradient(circle,#000 8%,transparent 66%);mask:radial-gradient(circle,#000 8%,transparent 66%);will-change:transform,opacity}
#uw{position:fixed;inset:0;pointer-events:none;display:none;z-index:2;
  background:radial-gradient(ellipse at center,rgba(30,110,160,.30) 0,rgba(10,50,100,.52) 100%)}
#cr{position:fixed;left:50%;top:50%;width:20px;height:20px;margin:-10px;pointer-events:none;z-index:3;mix-blend-mode:difference}
#cr:before,#cr:after{content:"";position:absolute;background:#fff}
#cr:before{left:9px;top:0;width:2px;height:20px}#cr:after{top:9px;left:0;height:2px;width:20px}
#in{position:fixed;left:calc(10px + var(--sal));top:calc(8px + var(--sat));z-index:3;pointer-events:none;
  text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.5);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
#hb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + var(--sab));display:flex;gap:3px;padding:3px;
  background:var(--glass);border:1px solid var(--edge);border-radius:8px;z-index:6;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sl{width:min(44px,8.2vw);aspect-ratio:1;border:2px solid rgba(255,255,255,.22);border-radius:5px;background:rgba(0,0,0,.28) center/78% no-repeat;
  image-rendering:pixelated;position:relative;touch-action:none}
.sl.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35),0 0 14px rgba(255,235,170,.55);background-color:rgba(255,255,255,.18)}
.sl i{position:absolute;left:3px;top:0;font:700 9px/14px ui-monospace,Menlo,monospace;color:#fff;text-shadow:0 1px 2px #000;font-style:normal;opacity:.8}
#bn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + var(--sab));z-index:6;pointer-events:none;
  padding:3px 12px;border-radius:5px;background:var(--glass);font-weight:600;opacity:0;transition:opacity .35s}
#bn.on{opacity:1;transition:none}

/* ---- touch controls ---- */
#tc{display:none}.t #tc{display:block}
#tz{position:fixed;inset:0;z-index:4;touch-action:none}
#jb{position:fixed;width:116px;height:116px;margin:-58px;border-radius:50%;background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.34);display:none;z-index:5;pointer-events:none}
#kn{position:absolute;left:35px;top:35px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.46);
  box-shadow:0 2px 10px rgba(0,0,0,.3)}
.bt{position:fixed;z-index:6;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:rgba(14,22,36,.42);border:2px solid rgba(255,255,255,.42);color:#fff;touch-action:none;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:transform .06s,background .08s}
.bt svg{width:46%;height:46%;pointer-events:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.bt.dn{transform:scale(.9);background:rgba(110,170,235,.55)}
.bt.on{background:rgba(242,193,78,.5);border-color:#ffe39a}
#bj{width:76px;height:76px;right:calc(16px + var(--sar));bottom:calc(70px + var(--sab))}
#bb{width:66px;height:66px;right:calc(100px + var(--sar));bottom:calc(70px + var(--sab))}
#bp{width:66px;height:66px;right:calc(100px + var(--sar));bottom:calc(146px + var(--sab))}
#bf{width:50px;height:50px;right:calc(22px + var(--sar));bottom:calc(158px + var(--sab))}
#bd{width:50px;height:50px;right:calc(22px + var(--sar));bottom:calc(214px + var(--sab));display:none}
#bm{width:42px;height:42px;right:calc(12px + var(--sar));top:calc(10px + var(--sat))}

/* ---- overlay ---- */
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(12px,var(--sat)) max(12px,var(--sar)) max(12px,var(--sab)) max(12px,var(--sal));
  background:radial-gradient(ellipse at 50% 30%,rgba(8,14,26,.30),rgba(5,9,18,.72));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{width:min(480px,100%);max-height:100%;overflow:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:22px 24px 20px;border-radius:14px;background:var(--glass);border:1px solid var(--edge);text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
h1{margin:0 0 4px;font:800 clamp(28px,8vw,42px)/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.06em;color:#fff;
  text-shadow:1px 1px 0 #3d7a26,2px 2px 0 #3d7a26,3px 3px 0 #2f6a1c,4px 4px 0 #2f6a1c,5px 5px 0 #1f4a12,6px 6px 10px rgba(0,0,0,.5)}
#ms{margin:12px 0 4px;opacity:.9;min-height:20px}
#pl{font:800 18px system-ui;margin:6px 0;padding:12px 40px;border:0;border-radius:7px;background:var(--grass);color:#fff;
  box-shadow:0 4px 0 var(--grass-d);cursor:pointer;touch-action:manipulation}
#pl:active{transform:translateY(2px);box-shadow:0 2px 0 var(--grass-d)}
#pl[hidden]{display:none}
#hp{margin:10px auto 6px;max-width:400px;opacity:.88;font-size:12.5px;line-height:1.75}
.k{display:inline-block;min-width:20px;padding:0 6px;margin:0 1px;border-radius:4px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);font:11px/18px ui-monospace,Menlo,monospace}
.row2{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.ghost{font:600 13px system-ui;padding:7px 14px;border:1px solid rgba(255,255,255,.4);border-radius:6px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;touch-action:manipulation}
.ghost:active{background:rgba(255,255,255,.22)}
.ghost.warn{border-color:#ffb36b;color:#ffd7a8}
#st{display:none;margin-top:14px;text-align:left;border-top:1px solid rgba(255,255,255,.16);padding-top:12px}
#st.open{display:block}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 0}
.sr label{flex:1;opacity:.92}
.sr output{min-width:58px;text-align:right;opacity:.7;font:11px ui-monospace,Menlo,monospace}
.sr select,.sr input[type=text]{font:inherit;color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:4px 6px;user-select:text;-webkit-user-select:text;max-width:150px}
.sr input[type=range]{width:130px;accent-color:var(--gold);touch-action:pan-y}
.sr input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.chips .ghost{padding:5px 10px;font-size:12px}
#sv{margin-top:8px;font-size:11px;opacity:.65;text-align:center}
#ov.hide{display:none}
</style>
</head>
<body>
<div id="fl"></div><div id="uw"></div><div id="cr"></div><div id="in"></div><div id="hb"></div><div id="bn"></div>
<div id="tc">
  <div id="tz"></div>
  <div id="jb"><i id="kn"></i></div>
  <div class="bt" id="bj"><svg viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6"/></svg></div>
  <div class="bt" id="bb"><svg viewBox="0 0 24 24"><path d="M5 20L14 11"/><path d="M7.5 8.5C11 4.5 16 4.5 20 8l-2.6 1.6-1.8-1.4-2.6 2.6 1.4 1.8L12.8 14z" fill="currentColor" stroke-width="1.2"/></svg></div>
  <div class="bt" id="bp"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/></svg></div>
  <div class="bt" id="bf"><svg viewBox="0 0 24 24"><path d="M3 12.5l18-8-6.5 16-3-6.5z"/><path d="M11.5 14l3-4"/></svg></div>
  <div class="bt" id="bd"><svg viewBox="0 0 24 24"><path d="M12 5v13M6 13l6 6 6-6"/></svg></div>
  <div class="bt" id="bm"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></div>
</div>
<div id="ov"><div class="card">
  <h1>BLOCKSCAPE</h1>
  <div id="ms">Generating world…</div>
  <button id="pl" hidden>Play</button>
  <div id="hp"></div>
  <div class="row2"><button class="ghost" id="bs">Settings</button><button class="ghost warn" id="nw">New world</button></div>
  <div id="st"></div>
  <div id="sv"></div>
</div></div>
<script>
/* ═══════════════════════════════════════════════════════════════════
   BLOCKSCAPE — single-file voxel sandbox (Three.js r128)
   Sections: 1 Config · 2 Noise · 3 Textures · 4 Blocks · 5 Renderer/Sky/Water
             6 World gen · 7 Chunks/Persistence · 8 Meshing · 9 Streaming
             10 Player/Physics/Interaction · 11 Audio · 12 Particles · 13 Mobs
             14 Clouds/Vapour/Flare · 15 UI/Input · 16 Main loop
   ═══════════════════════════════════════════════════════════════════ */
window.addEventListener('error',e=>{const m=document.getElementById('ms');if(m){m.textContent='Error: '+(e.message||e.error)}
  const o=document.getElementById('ov');if(o)o.classList.remove('hide')});
(function loadThree(){
  const urls=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js'];
  let i=0;
  (function next(){
    if(window.THREE){boot();return}
    if(i>=urls.length){document.getElementById('ms').textContent='Could not load Three.js — check your connection and reload.';return}
    const s=document.createElement('script');s.src=urls[i++];s.onload=next;s.onerror=next;document.head.appendChild(s);
  })();
})();

function boot(){
'use strict';
/* ═════════ 1. CONFIG / DEVICE / SETTINGS ═════════ */
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const mix=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const TAU=Math.PI*2;
const WH=96,SEA=30,CS=16,PH=WH+2,PW=18,DAY=600;
const UA=navigator.userAgent;
const mq=q=>{try{return matchMedia(q).matches}catch(e){return false}};
const AUTO_TOUCH=mq('(pointer:coarse)')||(/Android|iPhone|iPad|iPod|Mobi/i.test(UA)&&navigator.maxTouchPoints>0)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const DEFAULTS={quality:'auto',rd:0,shadows:true,sound:true,vol:.7,tspeed:1,sens:1,controls:'auto',stats:false,info:true,expo:1};
let META=null;try{META=JSON.parse(LS.get('bs2_meta')||'null')}catch(e){META=null}
if(!META||META.v!==2)META=null;
const S=Object.assign({},DEFAULTS,(META&&META.set)||{});
let TOUCH=S.controls==='touch'||(S.controls==='auto'&&AUTO_TOUCH);
document.body.classList.toggle('t',TOUCH);
const QUALITY={
  low:   {shadow:1024,pr:1,  rd:4,clouds:900, mobs:8, parts:100,vap:40, aniso:2,soft:false,bud:3.5,SH:28},
  medium:{shadow:2048,pr:1.5,rd:6,clouds:1800,mobs:12,parts:200,vap:80, aniso:4,soft:false,bud:5,  SH:38},
  high:  {shadow:3072,pr:2,  rd:8,clouds:2800,mobs:18,parts:320,vap:130,aniso:8,soft:true, bud:7,  SH:48}};
const autoTier=()=>TOUCH?((navigator.hardwareConcurrency||4)>=6?'medium':'low'):'high';
let Qk=S.quality==='auto'?autoTier():S.quality;if(!QUALITY[Qk])Qk=autoTier();
let Q=QUALITY[Qk];
let RDIST=S.rd>0?S.rd:Q.rd;

/* ═════════ 2. SEEDED NOISE / HASH ═════════ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let SEED=0,SEEDI=0;const PERM=new Uint8Array(512);
function initNoise(seed){
  SEED=seed>>>0;SEEDI=Math.imul(SEED,0x9E3779B1)|0;
  const r=mulberry32(SEED^0xA5A5A5A5),p=new Uint8Array(256);
  for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){const j=(r()*(i+1))|0,t=p[i];p[i]=p[j];p[j]=t}
  for(let i=0;i<512;i++)PERM[i]=p[i&255];
}
function hash2(x,z,s){let h=Math.imul(x|0,0x27d4eb2d)^Math.imul(z|0,0x165667b1)^Math.imul(s|0,0x9e3779b1)^SEEDI;h=Math.imul(h^(h>>>15),0x85ebca6b);h=Math.imul(h^(h>>>13),0xc2b2ae35);h^=h>>>16;return(h>>>0)/4294967296}
const fade=t=>t*t*t*(t*(t*6-15)+10);
function g2(h,x,y){switch(h&7){case 0:return x+y;case 1:return y-x;case 2:return x-y;case 3:return -x-y;case 4:return x;case 5:return -x;case 6:return y;default:return -y}}
function noise2(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),X=xi&255,Y=yi&255;x-=xi;y-=yi;
  const u=fade(x),v=fade(y),A=PERM[X]+Y,B=PERM[X+1]+Y;
  const a=g2(PERM[A],x,y),b=g2(PERM[B],x-1,y),c=g2(PERM[A+1],x,y-1),d=g2(PERM[B+1],x-1,y-1);
  const l1=a+(b-a)*u,l2=c+(d-c)*u;return(l1+(l2-l1)*v)*1.35;
}
function g3(h,x,y,z){h&=15;const u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v)}
function noise3(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),X=xi&255,Y=yi&255,Z=zi&255;x-=xi;y-=yi;z-=zi;
  const u=fade(x),v=fade(y),w=fade(z),A=PERM[X]+Y,AA=PERM[A]+Z,AB=PERM[A+1]+Z,B=PERM[X+1]+Y,BA=PERM[B]+Z,BB=PERM[B+1]+Z;
  const l=(t,a,b)=>a+t*(b-a);
  return l(w,l(v,l(u,g3(PERM[AA],x,y,z),g3(PERM[BA],x-1,y,z)),l(u,g3(PERM[AB],x,y-1,z),g3(PERM[BB],x-1,y-1,z))),
             l(v,l(u,g3(PERM[AA+1],x,y,z-1),g3(PERM[BA+1],x-1,y,z-1)),l(u,g3(PERM[AB+1],x,y-1,z-1),g3(PERM[BB+1],x-1,y-1,z-1))));
}
function fbm2(x,y,o){let s=0,a=1,n=0,f=1;for(let i=0;i<o;i++){s+=noise2(x*f+i*17.31,y*f-i*9.17)*a;n+=a;a*=.5;f*=2.03}return s/n}

/* ═════════ 3. PROCEDURAL TEXTURE ATLAS ═════════ */
function th(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function tn(x,y,cx,cy,s){
  const fx=(x+.5)/16*cx,fy=(y+.5)/16*cy,x0=Math.floor(fx),y0=Math.floor(fy),u=fx-x0,v=fy-y0,su=u*u*(3-2*u),sv=v*v*(3-2*v);
  const a=th(x0%cx,y0%cy,s),b=th((x0+1)%cx,y0%cy,s),c=th(x0%cx,(y0+1)%cy,s),d=th((x0+1)%cx,(y0+1)%cy,s);
  return a+(b-a)*su+(c-a)*sv+(a-b-c+d)*su*sv;
}
const fb=(x,y,s)=>tn(x,y,2,2,s)*.3+tn(x,y,4,4,s+1)*.3+tn(x,y,8,8,s+2)*.22+tn(x,y,16,16,s+3)*.18;
function vor(x,y,s){
  let d1=9,d2=9,id=0;const cx0=Math.floor(x/4),cy0=Math.floor(y/4);
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){
    const cx=cx0+i,cy=cy0+j,wx=((cx%4)+4)%4,wy=((cy%4)+4)%4;
    const px=cx*4+.6+th(wx,wy,s)*2.8,py=cy*4+.6+th(wx,wy,s+1)*2.8,d=Math.hypot(x+.5-px,y+.5-py);
    if(d<d1){d2=d1;d1=d;id=th(wx,wy,s+2)}else if(d<d2)d2=d;
  }
  return{d1,d2,id};
}
const TF={
  grass_top:(x,y)=>{const n=fb(x,y,10)-.5,m=th(x,y,11),bl=tn(x,y,16,16,12)>.8?10:0,v=n*46+(m-.5)*14+bl;return[84+v*.5,142+v,56+v*.4]},
  dirt:(x,y)=>{const n=fb(x,y,30)-.5,v=n*40+(th(x,y,31)-.5)*14,peb=tn(x,y,8,8,32)>.78?22:0,dk=th(x,y,33)>.93?-22:0;return[122+v+peb+dk,86+v*.85+peb+dk,58+v*.7+peb*.8+dk]},
  stone:(x,y)=>{const n=fb(x,y,40)-.5,r=Math.abs(tn(x,y,4,4,41)-.5)<.035?-20:0,p=tn(x,y,8,8,42)>.7?10:0,v=n*34+(th(x,y,43)-.5)*10+r+p;return[124+v,124+v,130+v]},
  sand:(x,y)=>{const n=fb(x,y,50)-.5,rip=Math.sin((y+tn(x,y,4,4,51)*3)*1.3)*3,v=n*20+(th(x,y,52)-.5)*10+rip;return[220+v,204+v*.95,152+v*.8]},
  log_side:(x,y)=>{const grain=tn(x,y,16,2,61)-.5,ridge=(x%4===0)?-14:(x%4===2?6:0),v=grain*36+ridge+(th(x,0,60)-.5)*14+(th(x,y,62)-.5)*8,knot=(Math.abs(x-10)<2&&Math.abs(y-6)<2)?-22:0;return[104+v+knot,76+v*.72+knot*.7,46+v*.45+knot*.4]},
  leaves:(x,y)=>{const n=fb(x,y,90)-.5,m=th(x,y,91);if(m<.1)return[0,0,0,0];const cl=tn(x,y,8,8,92)>.7?16:0,v=n*60+(m-.5)*24+cl;return[46+v*.5,104+v,36+v*.4]},
  sleaves:(x,y)=>{const n=fb(x,y,95)-.5,m=th(x,y,96);if(m<.08)return[0,0,0,0];const nd=((x+y)&3)===0?-14:0,v=n*44+(m-.5)*20+nd;return[28+v*.4,76+v*.85,54+v*.5]},
  planks:(x,y)=>{const row=y>>2,off=(row&1)*4,bx=Math.floor((x+off)/8),tone=(th(row,bx,101)-.5)*28,gap=(y&3)===3||((x+off)&7)===7,grain=(tn(x,y,16,4,102)-.5)*22+(th(x,y,103)-.5)*8,v=gap?-46:tone+grain;return[176+v,134+v*.85,80+v*.6]},
  cobble:(x,y)=>{const o=vor(x,y,110),e=(o.d2-o.d1)<.7,v=(o.id-.5)*44+(th(x,y,111)-.5)*10;return e?[88+v*.3,88+v*.3,92+v*.3]:[130+v,130+v,136+v]},

/* ═════════ 6. WORLD GENERATION ═════════ */
const ckey=(cx,cz)=>(cx+32768)*65536+(cz+32768);
const ckx=k=>Math.floor(k/65536)-32768,ckz=k=>k%65536-32768;
const MAXH=WH-14;
function colHeight(x,z){
  const c=fbm2(x*.0021,z*.0021,4)*2.4;
  const lm=sstep(-.1,.45,c);
  const hills=fbm2(x*.011+37.7,z*.011-91.3,4);
  const det=fbm2(x*.055-11.1,z*.055+7.7,2);
  const mt=fbm2(x*.0052+201.3,z*.0052-155.1,4)*2.4;
  let h=SEA+4+c*15+hills*(2.5+9*lm)*2.2*(.4+.6*lm)+det*1.6*(.3+.7*lm);
  const mm=sstep(.05,.7,mt)*sstep(0,.6,c);
  if(mm>0){const rg=1-Math.abs(fbm2(x*.009-61,z*.009+88,3))*2.6;h+=mm*(8+30*Math.pow(clamp(rg,0,1),1.3))}
  if(h>66)h=66+(h-66)*.55;

}
let CT=0,CW=0;
function climate(x,z){CT=fbm2(x*.0042+400.1,z*.0042-300.3,3)*2.4;CW=fbm2(x*.0075-500.7,z*.0075+120.9,3)*2.4}

function biomeAt(x,z,h,slope){
  const alt=h-SEA;if(alt<=-1)return B_OCEAN;
  climate(x,z);
  if(alt<=1)return(CT>.55&&CW<.1)?B_DESERT:B_BEACH;
  if(alt>=33+CT*6)return B_SNOW;
  if((slope>=4&&alt>9)||alt>=26+noise2(x*.09+9,z*.09-9)*7)return B_ROCK;
  if(CT>.55&&CW<.05&&alt<18)return B_DESERT;

}
function slopeAt(x,z,h){return Math.max(Math.abs(colHeight(x+1,z)-h),Math.abs(colHeight(x-1,z)-h),Math.abs(colHeight(x,z+1)-h),Math.abs(colHeight(x,z-1)-h))}

function genTree(kind,wx,gy,wz,put){
  let s=(hash2(wx,wz,777)*4294967296)>>>0||1;
  const rnd=()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296};
  const LG=kind===3?BIRCH:LOG,LF=kind===4?SLEAVES:LEAVES;

    const bx=Math.ceil(rx+.6),by=Math.ceil(ry+.6),bz=Math.ceil(rz+.6);
    for(let dy=-by;dy<=by;dy++)for(let dz=-bz;dz<=bz;dz++)for(let dx=-bx;dx<=bx;dx++){
      const d=(dx*dx)/(rx*rx)+(dy*dy)/(ry*ry)+(dz*dz)/(rz*rz),j=hash2(cx+dx+dy*57,cz+dz-dy*31,91);
      if(d<=1+(j-.5)*.55)put(cx+dx,cy+dy,cz+dz,LF,1);
    }};
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  if(kind===0){
    const th=6+(rnd()*3|0);for(let i=1;i<=th;i++)put(wx,gy+i,wz,LG,0);
    const ox=(rnd()*3|0)-1,oz=(rnd()*3|0)-1;
    blob(wx+ox,gy+th-1,wz+oz,3.4,2.5,3.4);blob(wx+ox,gy+th+2,wz+oz,1.9,1.5,1.9);
    const n=2+(rnd()*2|0);let last=-1;
    for(let b=0;b<n;b++){let di=rnd()*4|0;if(di===last)di=(di+1)&3;last=di;const[dx,dz]=dirs[di],by=gy+th-3+(rnd()*2|0);
      put(wx+dx,by,wz+dz,LG,0);put(wx+dx*2,by+1,wz+dz*2,LG,0);blob(wx+dx*3,by+1,wz+dz*3,2.2,1.7,2.2)}
  }else if(kind===1){
    const th=4+(rnd()*2|0);for(let i=1;i<=th;i++)put(wx,gy+i,wz,LG,0);
    blob(wx,gy+th,wz,2.8,2.6,2.8);blob(wx+((rnd()*3|0)-1),gy+th+2,wz+((rnd()*3|0)-1),1.7,1.3,1.7);
  }else if(kind===2){
    const th=5+(rnd()*3|0);for(let i=1;i<=th;i++)put(wx,gy+i,wz,LG,0);
    const di=rnd()*4|0,dj=(di+1+(rnd()*2|0)*2)&3;
    for(const d of[di,dj]){const[dx,dz]=dirs[d],base=gy+th-3+(rnd()*2|0);
      for(let k=1;k<=3;k++)put(wx+dx*k,base+((k+1)>>1),wz+dz*k,LG,0);
      blob(wx+dx*3,base+3,wz+dz*3,1.9,1.6,1.9)}

  }else if(kind===3){
    const th=5+(rnd()*4|0);for(let i=1;i<=th;i++)put(wx,gy+i,wz,LG,0);
    blob(wx,gy+th-1,wz,2.2,2.9,2.2);
  }else{
    const th=7+(rnd()*5|0);for(let i=1;i<=th;i++)put(wx,gy+i,wz,LG,0);
    const maxR=th>9?3:2;put(wx,gy+th+1,wz,LF,1);
    for(let t=0,y=gy+th;y>=gy+3;t++,y--){
      let r=Math.min(maxR,((t*.5+.6)|0));if(t>0&&(t&1)&&r>1)r--;if(r<1)r=1;
      for(let dz=-r;dz<=r;dz++)for(let dx=-r;dx<=r;dx++){
        if(!dx&&!dz)continue;if(r>1&&Math.abs(dx)===r&&Math.abs(dz)===r)continue;
        if(hash2(wx+dx,wz+dz,y)<.12)continue;put(wx+dx,y,wz+dz,LF,1)}
      put(wx,y,wz,LF,1);
    }
  }
}

const ST_GEN=1,ST_ACTIVE=2;
const CHUNKS=new Map(),EDITS=new Map(),DIRTY_ED=new Set(),INFLIGHT=new Set(),DIRTYQ=new Set();
let _lk=-1,_lc=null;
const caveA=new Float32Array(5*5*25),caveB=new Float32Array(5*5*25);
const HG=new Int16Array(18*18),BIOC=new Uint8Array(256);
function generateChunk(cx,cz){
  const X0=cx*16,Z0=cz*16,d=new Uint8Array(16*WH*16);let maxY=0,hasWater=false;
  for(let z=-1;z<=16;z++)for(let x=-1;x<=16;x++)HG[(z+1)*18+x+1]=colHeight(X0+x,Z0+z);
  for(let z=0;z<16;z++)for(let x=0;x<16;x++){
    const wx=X0+x,wz=Z0+z,gi=(z+1)*18+x+1,h=HG[gi];
    const slope=Math.max(Math.abs(HG[gi-1]-h),Math.abs(HG[gi+1]-h),Math.abs(HG[gi-18]-h),Math.abs(HG[gi+18]-h));

  for(let iz=0;iz<5;iz++)for(let ix=0;ix<5;ix++)for(let iy=0;iy<25;iy++){
    const wx=X0+ix*4,wy=iy*4,wz=Z0+iz*4,i=(iz*5+ix)*25+iy;

      const iy=y>>2,fy=(y&3)*.25,o=(y*16+z)*16+x;if(d[o]!==STONE)continue;
      const a=mix(mix(mix(caveA[b00+iy],caveA[b10+iy],fx),mix(caveA[b01+iy],caveA[b11+iy],fx),fz),mix(mix(caveA[b00+iy+1],caveA[b10+iy+1],fx),mix(caveA[b01+iy+1],caveA[b11+iy+1],fx),fz),fy);
      if(a>.058||a<-.058)continue;
      const b=mix(mix(mix(caveB[b00+iy],caveB[b10+iy],fx),mix(caveB[b01+iy],caveB[b11+iy],fx),fz),mix(mix(caveB[b00+iy+1],caveB[b10+iy+1],fx),mix(caveB[b01+iy+1],caveB[b11+iy+1],fx),fz),fy);

    const o=(y*16+lz)*16+lx,cur=d[o];

    const wx=X0+tx,wz=Z0+tz,r=hash2(wx,wz,5);if(r>=.06)continue;

    if(!ok)continue;

    else if(bio===B_PLAINS&&r<.004)kind=k<.4?1:k<.7?0:2;

  const c={cx,cz,d,maxY:Math.min(maxY+1,WH-1),hasWater,state:ST_GEN,mesh:null,wmesh:null,dist:0};

function getChunk(cx,cz){const k=ckey(cx,cz);if(k===_lk)return _lc;const c=CHUNKS.get(k);_lk=k;_lc=c;return c}

/* ═════════ 7. PERSISTENCE ═════════ */
let storeMode='none',idb=null,noSave=false,saveTimer=0,flushing=false,savedOK=true;
const edLabel=k=>ckx(k)+','+ckz(k);
const packEdits=m=>{const a=[];for(const[i,b]of m)a.push(i*256+b);return a};
function unpackInto(k,arr){let m=EDITS.get(k);if(!m){m=new Map();EDITS.set(k,m)}for(const v of arr)m.set(v>>8,v&255)}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
function idbOpen(){return new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('no indexedDB'));let r;
  try{r=indexedDB.open('blockscape2',1)}catch(e){return rej(e)}
  r.onupgradeneeded=()=>{try{r.result.createObjectStore('edits')}catch(e){}};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('idb error'));r.onblocked=()=>rej(new Error('idb blocked'))})}
function idbLoad(seed){return new Promise((res,rej)=>{
  const out=[],st=idb.transaction('edits','readonly').objectStore('edits'),rq=st.openCursor(IDBKeyRange.bound(seed+'/',seed+'/\uffff'));
  rq.onsuccess=()=>{const c=rq.result;if(c){out.push([c.key,c.value]);c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})}
function idbWrite(snap){return new Promise((res,rej)=>{
  const tx=idb.transaction('edits','readwrite'),st=tx.objectStore('edits');
  for(const[k,a]of snap){const key=SEED+'/'+edLabel(k);if(a)st.put(a,key);else st.delete(key)}
  tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error||new Error('tx error'));tx.onabort=()=>rej(tx.error||new Error('tx abort'))})}
function lsWriteAll(){const d={};for(const[k,m]of EDITS)if(m.size)d[edLabel(k)]=packEdits(m);return LS.set('bs2_ed',JSON.stringify({seed:SEED,d}))}
function lsReadAll(){try{const o=JSON.parse(LS.get('bs2_ed')||'null');if(o&&o.seed===SEED)for(const l in o.d){const[a,b]=l.split(',');unpackInto(ckey(+a,+b),o.d[l])}}catch(e){}}
function pendSync(){
  if(noSave)return;const keys=new Set([...DIRTY_ED,...INFLIGHT]);if(!keys.size)return;
  const d={};for(const k of keys){const m=EDITS.get(k);d[edLabel(k)]=m?packEdits(m):[]}
  LS.set('bs2_pend',JSON.stringify({seed:SEED,d}));
}
function mergePend(){
  let o=null;try{o=JSON.parse(LS.get('bs2_pend')||'null')}catch(e){}
  if(!o||o.seed!==SEED)return;
  for(const l in o.d){const[a,b]=l.split(','),k=ckey(+a,+b);EDITS.delete(k);if(o.d[l].length)unpackInto(k,o.d[l]);DIRTY_ED.add(k)}
  if(DIRTY_ED.size)scheduleSave(300);
}
async function initStore(){
  try{
    idb=await withTimeout(idbOpen(),2500);storeMode='idb';
    const rows=await withTimeout(idbLoad(SEED),4000);
    for(const[key,arr]of rows){const[a,b]=key.slice(key.indexOf('/')+1).split(',');unpackInto(ckey(+a,+b),arr)}
  }catch(e){
    idb=null;EDITS.clear();
    if(LS.set('bs2_probe','1')){LS.del('bs2_probe');storeMode='ls';lsReadAll()}else storeMode='none';
  }
  mergePend();
}
function scheduleSave(ms){if(noSave||saveTimer)return;saveTimer=setTimeout(()=>{saveTimer=0;flushEdits()},ms||900)}
async function flushEdits(){
  if(noSave||flushing||!DIRTY_ED.size)return;flushing=true;
  const keys=[...DIRTY_ED];DIRTY_ED.clear();for(const k of keys)INFLIGHT.add(k);
  const snap=keys.map(k=>{const m=EDITS.get(k);return[k,m&&m.size?packEdits(m):null]});
  let ok=false;
  try{
    if(storeMode==='idb'){await withTimeout(idbWrite(snap),6000);ok=true}
    else if(storeMode==='ls'){ok=lsWriteAll()}
  }catch(e){
    if(storeMode==='idb'){storeMode=LS.set('bs2_probe','1')?'ls':'none';LS.del('bs2_probe');if(storeMode==='ls')ok=lsWriteAll()}
  }
  for(const k of keys)INFLIGHT.delete(k);
  if(ok){savedOK=true;if(!DIRTY_ED.size&&!INFLIGHT.size)LS.del('bs2_pend')}
  else{savedOK=false;for(const k of keys)DIRTY_ED.add(k)}
  flushing=false;
  if(DIRTY_ED.size&&ok)scheduleSave(900);

async function clearStore(){
  EDITS.clear();DIRTY_ED.clear();INFLIGHT.clear();LS.del('bs2_pend');LS.del('bs2_ed');
  if(idb){try{await withTimeout(new Promise((res,rej)=>{const tx=idb.transaction('edits','readwrite');tx.objectStore('edits').clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)}),3000)}catch(e){}}
}
function editCount(){let n=0;for(const m of EDITS.values())n+=m.size;return n}

/* ═════════ 8. MESHING ═════════ */

/* ═════════ 9. STREAMING ═════════ */
let OFF=[],OFFR=-1;
function buildOffsets(R){OFF=[];OFFR=R;const G=(R+1.6)*(R+1.6);for(let j=-R-2;j<=R+2;j++)for(let i=-R-2;i<=R+2;i++){const d=i*i+j*j;if(d<=G)OFF.push([i,j,d])}OFF.sort((a,b)=>a[2]-b[2])}
let lastEvict=0;
function neighboursReady(cx,cz){for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++)if(!CHUNKS.has(ckey(cx+dx,cz+dz)))return false;return true}
function streamChunks(budgetMs){
  if(OFFR!==RDIST)buildOffsets(RDIST);
  const t0=performance.now(),pcx=Math.floor(P.x/16),pcz=Math.floor(P.z/16),R=RDIST;
  let busy=false;
  let guard=0;for(const c of DIRTYQ){DIRTYQ.delete(c);if(c.state===ST_ACTIVE&&neighboursReady(c.cx,c.cz))meshChunk(c);if(++guard>=6)break}
  for(let n=0;n<OFF.length;n++){
    const o=OFF[n];if(CHUNKS.has(ckey(pcx+o[0],pcz+o[1])))continue;
    busy=true;if(performance.now()-t0>budgetMs&&n>8)break;generateChunk(pcx+o[0],pcz+o[1]);
  }
  for(let n=0;n<OFF.length;n++){
    const o=OFF[n];if(o[2]>R*R+1)break;
    const c=CHUNKS.get(ckey(pcx+o[0],pcz+o[1]));
    if(!c||c.state!==ST_GEN||!neighboursReady(c.cx,c.cz))continue;
    busy=true;if(performance.now()-t0>budgetMs)break;meshChunk(c);
  }
  const now=performance.now();
  if(now-lastEvict>400){
    lastEvict=now;
    for(const c of CHUNKS.values()){
      const dd=Math.max(Math.abs(c.cx-pcx),Math.abs(c.cz-pcz));
      if(dd>R+3)unloadChunk(c);else if(dd>R+2&&c.state===ST_ACTIVE){disposeMesh(c);c.state=ST_GEN}
    }
  }
  return busy;
}
function chunksReady(r){
  const pcx=Math.floor(P.x/16),pcz=Math.floor(P.z/16);
  for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const c=CHUNKS.get(ckey(pcx+i,pcz+j));if(!c||c.state!==ST_ACTIVE)return false}
  return true;
}
function findSpawn(){
  for(let r=0;r<700;r+=10){
    const steps=Math.max(1,Math.floor(r/6));
    for(let k=0;k<steps;k++){
      const a=k/steps*TAU,x=Math.floor(Math.cos(a)*r),z=Math.floor(Math.sin(a)*r),h=colHeight(x,z);
      if(h<=SEA+3||h>SEA+14)continue;
      const bio=biomeAt(x,z,h,slopeAt(x,z,h));
      if(bio===B_PLAINS||bio===B_FOREST)return[x,z,h];
    }
  }
  return[0,0,Math.max(colHeight(0,0),SEA+2)];
}

/* ═════════ 10. PLAYER · PHYSICS · RAYCAST · EDITING ═════════ */
const P={x:0,y:60,z:0,vx:0,vy:0,vz:0,yaw:-1.35,pit:.05,fly:false,ground:false,hx:false,wet:false,under:false,bob:0,sprint:false};
const PR=.3,PHT=1.8,EYE=1.62;
const key=Object.create(null),joy={x:0,y:0,sprint:false},act={jump:false,down:false,brk:false,plc:false};
const HB=HOTBAR.slice();let sel=0;

function boxHits(x,y,z,r,h){
  const x0=Math.floor(x-r),x1=Math.floor(x+r),z0=Math.floor(z-r),z1=Math.floor(z+r),y0=Math.floor(y),y1=Math.floor(y+h-.001);
  for(let j=y0;j<=y1;j++)for(let k=z0;k<=z1;k++)for(let i=x0;i<=x1;i++)if(SOLID[getBlock(i,j,k)])return true;
  return false;
}
function moveBody(o,dt,r,h){
  o.hx=false;o.ground=false;
  const dx=o.vx*dt,dy=o.vy*dt,dz=o.vz*dt;
  const n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy),Math.abs(dz))/.25));
  const sx=dx/n,sy=dy/n,sz=dz/n;let bx=false,bz=false,by=false;
  for(let i=0;i<n;i++){
    if(sx&&!bx){const p=o.x;o.x+=sx;if(boxHits(o.x,o.y,o.z,r,h)){
      o.x=sx>0?Math.floor(o.x+r)-r-.001:Math.floor(o.x-r)+1+r+.001;if(boxHits(o.x,o.y,o.z,r,h))o.x=p;o.vx=0;o.hx=true;bx=true}}

      o.z=sz>0?Math.floor(o.z+r)-r-.001:Math.floor(o.z-r)+1+r+.001;if(boxHits(o.x,o.y,o.z,r,h))o.z=p;o.vz=0;o.hx=true;bz=true}}
    if(sy&&!by){const p=o.y;o.y+=sy;if(boxHits(o.x,o.y,o.z,r,h)){
      if(sy>0)o.y=Math.floor(o.y+h)-h-.001;else{o.y=Math.floor(o.y)+1.001;o.ground=true}
      if(boxHits(o.x,o.y,o.z,r,h))o.y=p;o.vy=0;by=true}}

let stepAcc=0,wasWet=false;
function surfaceSound(){const b=getBlock(Math.floor(P.x),Math.floor(P.y-.1),Math.floor(P.z));return BD[b]?b:GRASS}
function pstep(dt){
  const L=(key.ArrowLeft?1:0)-(key.ArrowRight?1:0),U=(key.ArrowUp?1:0)-(key.ArrowDown?1:0);
  if(L)P.yaw+=L*2*dt;if(U)P.pit=clamp(P.pit+U*1.6*dt,-1.55,1.55);
  let f=(key.KeyW?1:0)-(key.KeyS?1:0)-joy.y,s=(key.KeyD?1:0)-(key.KeyA?1:0)+joy.x;
  const l=Math.hypot(f,s);if(l>1){f/=l;s/=l}
  const wet=getBlock(Math.floor(P.x),Math.floor(P.y+.4),Math.floor(P.z))===WATER;
  const shift=!!(key.ShiftLeft||key.ShiftRight),boost=!!(key.ControlLeft||key.KeyQ||joy.sprint);
  P.sprint=!P.fly&&!wet&&f>.1&&(shift||joy.sprint);P.wet=wet;
  const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
  const sp=P.fly?(boost?26:11):wet?2.8:P.sprint?6.8:4.3;
  const k=Math.min(1,dt*(P.ground||P.fly||wet?10:2.6)),wx=-sy*f+cy*s,wz=-cy*f-sy*s;

  if(P.fly)P.vy+=(((up?1:0)-(dn?1:0))*(boost?14:8)-P.vy)*Math.min(1,dt*8);
  else if(wet){P.vy+=((up?3.6:-1.9)-P.vy)*Math.min(1,dt*4);if(P.hx&&up)P.vy=6.4}
  else{P.vy=Math.max(P.vy-28*dt,-52);if(up&&P.ground){P.vy=8.6;P.ground=false;sndJump()}}
  const pvy=P.vy;moveBody(P,dt,PR,PHT);
  if(P.ground&&pvy<-11&&!P.fly)sndLand();

    const wl=Math.hypot(wx,wz)||1;if(!boxHits(P.x+wx/wl*.5,P.y+1.02,P.z+wz/wl*.5,PR,PHT))P.vy=8.6;
  }

}
function pushOutOfBlocks(){let n=0;while(boxHits(P.x,P.y,P.z,PR,PHT)&&n++<40)P.y+=1}

const TG={x:0,y:0,z:0,b:0,nx:0,ny:0,nz:0,d:0};
function aimDir(out){const c=Math.cos(P.pit);out[0]=-Math.sin(P.yaw)*c;out[1]=Math.sin(P.pit);out[2]=-Math.cos(P.yaw)*c}
const _aim=[0,0,0];
function castBlock(maxD){
  aimDir(_aim);const dx=_aim[0],dy=_aim[1],dz=_aim[2],ox=P.x,oy=P.y+EYE,oz=P.z;
  let x=Math.floor(ox),y=Math.floor(oy),z=Math.floor(oz);
  const sx=dx>0?1:-1,sy=dy>0?1:-1,sz=dz>0?1:-1,ax=Math.abs(1/(dx||1e-9)),ay=Math.abs(1/(dy||1e-9)),az=Math.abs(1/(dz||1e-9));

  for(let i=0;i<80&&t<=maxD;i++){
    const b=getBlock(x,y,z);
    if(b!==AIR&&b!==WATER){TG.x=x;TG.y=y;TG.z=z;TG.b=b;TG.nx=nx;TG.ny=ny;TG.nz=nz;TG.d=t;return true}
    if(tx<ty&&tx<tz){x+=sx;t=tx;tx+=ax;nx=-sx;ny=0;nz=0}
    else if(ty<tz){y+=sy;t=ty;ty+=ay;nx=0;ny=-sy;nz=0}
    else{z+=sz;t=tz;tz+=az;nx=0;ny=0;nz=-sz}

}
function rayBlocked(ox,oy,oz,dx,dy,dz,maxD){

  const sx=dx>0?1:-1,sy=dy>0?1:-1,sz=dz>0?1:-1,ax=Math.abs(1/(dx||1e-9)),ay=Math.abs(1/(dy||1e-9)),az=Math.abs(1/(dz||1e-9));

  for(let i=0;i<200&&t<=maxD;i++){

    if(tx<ty&&tx<tz){x+=sx;t=tx;tx+=ax}else if(ty<tz){y+=sy;t=ty;ty+=ay}else{z+=sz;t=tz;tz+=az}
  }

}
function breakBlock(){
  if(!castBlock(6.5))return false;

  if(y<1||b===BEDROCK)return false;

}
function placeBlock(){
  if(!castBlock(6.5))return false;
  let x=TG.x,y=TG.y,z=TG.z;
  if(!PLANT[TG.b]){x+=TG.nx;y+=TG.ny;z+=TG.nz}
  if(y<1||y>=WH||!loadedAt(x,z))return false;
  const cur=getBlock(x,y,z);if(!(cur===AIR||cur===WATER||PLANT[cur]))return false;
  if(x+1>P.x-PR&&x<P.x+PR&&y+1>P.y&&y<P.y+PHT&&z+1>P.z-PR&&z<P.z+PR)return false;
  for(let i=0;i<mobs.length;i++){const m=mobs[i];if(x+1>m.x-m.r&&x<m.x+m.r&&y+1>m.y&&y<m.y+m.h&&z+1>m.z-m.r&&z<m.z+m.r)return false}

}

  if(!castBlock(8))return;const b=TG.b;if(b===BEDROCK||PLANT[b]||!BD[b])return;

}

  else if(noLock&&mdrag){const dx=e.clientX-mdrag.x,dy=e.clientY-mdrag.y;mdrag.x=e.clientX;mdrag.y=e.clientY;mdrag.m+=Math.abs(dx)+Math.abs(dy);P.yaw-=dx*.0030*S.sens;P.pit=clamp(P.pit-dy*.0030*S.sens,-1.55,1.55)}
});
addEventListener('wheel',e=>{if(started&&!TOUCH)selectSlot((sel+(e.deltaY>0?1:HB.length-1))%HB.length)},{passive:true});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('gesturechange',e=>e.preventDefault());
addEventListener('blur',()=>{for(const k in key)key[k]=0;holdBreak=holdPlace=false});

const tz=$('tz'),jb=$('jb'),kn=$('kn');let jP=null,lP=null;
const JR=46;
tz.addEventListener('pointerdown',e=>{
  if(!started||!TOUCH)return;e.preventDefault();try{tz.setPointerCapture(e.pointerId)}catch(_){}
  if(!jP&&e.clientX<innerWidth*.5){jP={id:e.pointerId,ox:e.clientX,oy:e.clientY};jb.style.cssText=`display:block;left:${e.clientX}px;top:${e.clientY}px`;kn.style.transform='none';joy.x=joy.y=0}
  else if(!lP)lP={id:e.pointerId,x:e.clientX,y:e.clientY};
});
tz.addEventListener('pointermove',e=>{
  if(!started||!TOUCH)return;
  if(jP&&e.pointerId===jP.id){
    let dx=e.clientX-jP.ox,dy=e.clientY-jP.oy;const l=Math.hypot(dx,dy);if(l>JR){dx*=JR/l;dy*=JR/l}
    kn.style.transform=`translate(${dx}px,${dy}px)`;const mx=dx/JR,my=dy/JR,m=Math.hypot(mx,my);
    if(m<.14){joy.x=joy.y=0}else{joy.x=mx;joy.y=my}
    joy.sprint=l>=JR*.98&&-my>.55;kn.style.background=joy.sprint?'rgba(242,193,78,.7)':'';
  }else if(lP&&e.pointerId===lP.id){
    const dx=e.clientX-lP.x,dy=e.clientY-lP.y;lP.x=e.clientX;lP.y=e.clientY;
    P.yaw-=dx*.0052*S.sens;P.pit=clamp(P.pit-dy*.0052*S.sens,-1.55,1.55);
  }
});
const tEnd=e=>{
  if(jP&&e.pointerId===jP.id){jP=null;joy.x=joy.y=0;joy.sprint=false;jb.style.display='none';kn.style.background=''}
  else if(lP&&e.pointerId===lP.id)lP=null;
};
tz.addEventListener('pointerup',tEnd);tz.addEventListener('pointercancel',tEnd);tz.addEventListener('lostpointercapture',tEnd);
function holdBtn(id,down,up){
  const el=$(id);let on=false;
  el.addEventListener('pointerdown',e=>{if(!started||!TOUCH)return;e.preventDefault();e.stopPropagation();try{el.setPointerCapture(e.pointerId)}catch(_){}on=true;el.classList.add('dn');down&&down()});
  const end=()=>{if(!on)return;on=false;el.classList.remove('dn');up&&up()};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end);
}
holdBtn('bj',()=>{act.jump=true},()=>{act.jump=false});
holdBtn('bd',()=>{act.down=true},()=>{act.down=false});
holdBtn('bb',()=>{act.brk=true;breakT=.24;breakBlock()},()=>{act.brk=false});
holdBtn('bp',()=>{act.plc=true;plcT=.28;placeBlock()},()=>{act.plc=false});
holdBtn('bf',()=>{toggleFly()});
holdBtn('bm',()=>{pauseGame()});

/* ═════════ 16. RESIZE · LIFECYCLE ═════════ */
function onResize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();updateVapScale()}
addEventListener('resize',onResize);addEventListener('orientationchange',()=>setTimeout(onResize,250));
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(started)pauseGame();else persistAll()}});
addEventListener('pagehide',persistAll);addEventListener('beforeunload',persistAll);
setInterval(()=>{if(started||ready)saveMeta()},5000);

/* ═════════ 17. MAIN LOOP ═════════ */
const infoEl=$('in'),uwEl=$('uw');
let last=performance.now(),fovC=72,bobAmp=0,infoT=0,fpsA=0,fpsN=0,fpsV=0,adaptT=0,adaptAvg=1/60,spawnT=1,uwF=false;
const _hl=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.006,1.006,1.006)),new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.62}));
_hl.visible=false;scene.add(_hl);
const _hf=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.14,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));
_hf.visible=false;scene.add(_hf);
const _zv=V3(0,0,1),_nv=V3();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(!(dt>0))return;if(dt>.1)dt=.1;
  const gdt=started?dt:0;
  if(started){
    const n=Math.ceil(dt/.0167);for(let i=0;i<n;i++)pstep(dt/n);
    if((holdBreak||act.brk)&&(breakT-=dt)<=0){breakT=.2;breakBlock()}
    if((holdPlace||act.plc)&&(plcT-=dt)<=0){plcT=.26;placeBlock()}
  }
  const hs=Math.hypot(P.vx,P.vz);
  bobAmp+=((started&&P.ground&&hs>.5&&!P.fly&&!P.wet?1:0)-bobAmp)*Math.min(1,dt*8);P.bob+=dt*hs*2.3;
  const bobY=Math.sin(P.bob)*.05*bobAmp,bobX=Math.cos(P.bob*.5)*.03*bobAmp;
  camera.position.set(P.x+Math.cos(P.yaw)*bobX,P.y+EYE+bobY,P.z-Math.sin(P.yaw)*bobX);camera.rotation.set(P.pit,P.yaw,0);
  const fv=72+(P.sprint&&hs>5?7:0)+(P.fly&&hs>14?9:0);fovC+=(fv-fovC)*Math.min(1,dt*6);
  if(Math.abs(camera.fov-fovC)>.05){camera.fov=fovC;camera.updateProjectionMatrix();updateVapScale()}
  camera.updateMatrixWorld();
  const ex=Math.floor(camera.position.x),ez=Math.floor(camera.position.z),eyeY=camera.position.y,fy=Math.floor(eyeY);
  const uw=getBlock(ex,fy,ez)===WATER&&(eyeY-fy<.88||getBlock(ex,fy+1,ez)===WATER);P.under=uw;
  if(uw!==uwF){uwF=uw;uwEl.style.display=uw?'block':'none'}
  updateSky(gdt,dt);
  const fg=scene.fog;
  if(uw){fg.near=.4;fg.far=22+12*dk;SU.uwf.value=1;SU.uwc.value.setRGB(.05,.24,.36).multiplyScalar(.2+.8*dk);fg.color.copy(SU.uwc.value)}
  else{fg.far=RDIST*16-8;fg.near=fg.far*(.34-.12*ssv);SU.uwf.value=0;fg.color.copy(SU.hor.value)}
  SU.fogR.value.set(fg.near,fg.far);
  renderer.toneMappingExposure=S.expo*(uw?.9:1);
  sky.position.copy(camera.position);
  const busy=streamChunks(ready?Q.bud:60);
  if(!ready){
    const lim=Math.min(RDIST*RDIST+1,13),pcx=Math.floor(P.x/16),pcz=Math.floor(P.z/16);let tot=0,okc=0;
    for(let j=-4;j<=4;j++)for(let i=-4;i<=4;i++)if(i*i+j*j<=lim){tot++;const c=CHUNKS.get(ckey(pcx+i,pcz+j));if(c&&c.state===ST_ACTIVE)okc++}
    if(okc===tot){
      ready=true;
      if(fresh&&!META_POS){P.y=colHeight(Math.floor(P.x),Math.floor(P.z))+1.01}
      pushOutOfBlocks();for(let i=0;i<90&&mobs.length<Math.ceil(Q.mobs*.7);i++)spawnMob(false);
      $('ms').textContent='World ready';$('pl').hidden=false;setHelp();updateSaveLine();saveMeta();
    }else $('ms').textContent='Generating world… '+Math.floor(okc/tot*100)+'%';
  }
  if(started&&ready){
    updateMobs(dt);if((spawnT-=dt)<0){spawnT=1.2;spawnMob(false)}
    updateParticles(dt);
  }
  updateClouds(dt);updateVapour(dt);
  if(started&&castBlock(6.5)){
    _hl.visible=true;_hl.position.set(TG.x+.5,TG.y+.5,TG.z+.5);
    if(TG.nx||TG.ny||TG.nz){_nv.set(TG.nx,TG.ny,TG.nz);_hf.visible=true;_hf.position.set(TG.x+.5+TG.nx*.503,TG.y+.5+TG.ny*.503,TG.z+.5+TG.nz*.503);_hf.quaternion.setFromUnitVectors(_zv,_nv)}else _hf.visible=false;
  }else{_hl.visible=false;_hf.visible=false}
  updateFlare(dt);audioUpdate(dt);
  fpsA+=dt;fpsN++;if(fpsA>.5){fpsV=Math.round(fpsN/fpsA);fpsA=0;fpsN=0}
  if((infoT-=dt)<0){
    infoT=.25;const h=(tod*24+6)%24;let t='';
    if(S.info)t=`${Math.floor(P.x)}  ${Math.floor(P.y)}  ${Math.floor(P.z)}  ·  ${Math.floor(h)}:${String(Math.floor(h%1*60)).padStart(2,'0')}${P.fly?'  ·  flying':''}`;
    if(S.stats)t+=(t?'\n':'')+`${fpsV} fps · ${CHUNKS.size} chunks · ${mobs.length} mobs`;
    infoEl.textContent=t;
  }
  renderer.render(scene,camera);
  adaptAvg+=(dt-adaptAvg)*.05;adaptT+=dt;
  if(S.quality==='auto'&&started&&ready&&!busy&&adaptT>2.5){
    adaptT=0;
    if(adaptAvg>1/36&&prScale>.55){prScale=Math.max(.55,prScale*.87);applyPR()}
    else if(adaptAvg<1/56&&prScale<1){prScale=Math.min(1,prScale*1.1);applyPR()}
  }
}

/* ═════════ BOOT ═════════ */
let META_POS=false;
(async function start(){
  try{
    let seed=META&&typeof META.seed==='number'?META.seed:((Math.random()*4294967296)>>>0);
    initNoise(seed);
    if(META&&Array.isArray(META.hb))for(let i=0;i<HB.length;i++){const b=META.hb[i];if(BD[b]&&b!==WATER&&!PLANT[b]&&b!==BEDROCK)HB[i]=b}
    if(META&&typeof META.sel==='number')sel=clamp(META.sel|0,0,HB.length-1);
    buildHotbar();buildSettings();setHelp();applyQuality();onResize();
    infoEl.style.display=S.info||S.stats?'block':'none';
    await initStore();
    if(META&&Array.isArray(META.p)&&META.p.length>=5&&META.p.every(Number.isFinite)){
      P.x=META.p[0];P.y=META.p[1];P.z=META.p[2];P.yaw=META.p[3];P.pit=clamp(META.p[4],-1.55,1.55);META_POS=true;fresh=false;
    }else{const sp=findSpawn();P.x=sp[0]+.5;P.z=sp[1]+.5;P.y=sp[2]+2}
    fresh=!META_POS;
    updateSaveLine();
    last=performance.now();requestAnimationFrame(frame);
  }catch(err){$('ms').textContent='Error: '+(err&&err.message||err);console.error(err)}
})();
window.__BS={SU,sun,hemi,setTod:v=>{tod=v},scene,camera,CHUNKS,EDITS,P,getBlock,setBlock,colHeight,biomeAt,findSpawn,flushEdits,editCount,mobs,get seed(){return SEED},get storeMode(){return storeMode},generateChunk,meshChunk,castBlock,TG,pstep,moveBody,streamChunks};
}
