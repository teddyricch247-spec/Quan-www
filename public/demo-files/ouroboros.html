/* ============================================================
   15 · CAMERA
   ============================================================ */
function updateCamera(dt){
  const p = player;
  if (!p) return;

  const k = camInit ? 1 - Math.exp(-10 * dt) : 1;

  // Effective yaw = player yaw + user offset
  const targetYaw = p.yaw + camOffsetYaw;
  if (!camInit) camYaw = targetYaw;
  camYaw += angleDiff(targetYaw, camYaw) * (1 - Math.exp(-8 * dt));

  const fx = Math.sin(camYaw), fz = Math.cos(camYaw);

  const speedK = clamp(p.speed / p.baseSpeed, 1, 2);
  const dist = 15.5 + p.radius*1.3 + (p.boosting ? 3.2 : 0);
  const baseH = 6.8 + (p.boosting ? 1.1 : 0) + speedK*0.3;
  const pitchAdj = camOffsetPitch * 15;
  let hgt = clamp(baseH + pitchAdj, 2.5, 26);

  let dx = p.headPos.x - fx*dist;
  let dz = p.headPos.z - fz*dist;
  let dy = hgt;

  // Keep the camera inside the arena
  const lim = CFG.arenaHalf - 3;
  let clamped = false;
  if (dx < -lim){ dx = -lim; clamped = true; }
  if (dx >  lim){ dx =  lim; clamped = true; }
  if (dz < -lim){ dz = -lim; clamped = true; }
  if (dz >  lim){ dz =  lim; clamped = true; }
  if (clamped) dy += 2.4;

  camera.position.x += (dx - camera.position.x) * k;
  camera.position.y += (dy - camera.position.y) * k;
  camera.position.z += (dz - camera.position.z) * k;

  const lookAhead = 9 + p.speed * 0.30;
  const lx = p.headPos.x + fx*lookAhead;
  const lz = p.headPos.z + fz*lookAhead;
  const ly = 2.8 + camOffsetPitch * 3.5;

  camLookAt.x += (lx - camLookAt.x) * k;
  camLookAt.y += (ly - camLookAt.y) * k;
  camLookAt.z += (lz - camLookAt.z) * k;

  camera.lookAt(camLookAt.x, camLookAt.y, camLookAt.z);
  camera.rotateZ(-p.steer * 0.048 - (p.boosting ? 0.012 : 0));

  const targetFov = p.boosting ? 78 : 66;
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt*4.5);
  camera.updateProjectionMatrix();

  camInit = true;
}

/* ============================================================
   16 · MINIMAP
   ============================================================ */
const mapCanvas = document.getElementById('minimap');
const mctx = mapCanvas.getContext('2d');
let MAP_W = 186, MAP_DPR = 1;

function sizeMinimap(){
  const rect = mapCanvas.getBoundingClientRect();
  MAP_DPR = Math.min(window.devicePixelRatio || 1, 2);
  MAP_W = Math.max(64, Math.round(rect.width));
  mapCanvas.width  = Math.round(MAP_W * MAP_DPR);
  mapCanvas.height = Math.round(MAP_W * MAP_DPR);
}

function drawMinimap(){
  const W = mapCanvas.width, H = mapCanvas.height;
  const k = W / (CFG.arenaHalf*2);
  const tx = x => (x + CFG.arenaHalf) * k;
  const tz = z => (z + CFG.arenaHalf) * k;
  const S = MAP_DPR;

  mctx.clearRect(0,0,W,H);
  mctx.fillStyle = 'rgba(5,11,20,0.94)';
  mctx.fillRect(0,0,W,H);

  mctx.strokeStyle = 'rgba(90,160,220,0.09)';
  mctx.lineWidth = 1*S;
  for (let i=1;i<6;i++){
    const p = W*i/6;
    mctx.beginPath(); mctx.moveTo(p,0); mctx.lineTo(p,H); mctx.stroke();
    mctx.beginPath(); mctx.moveTo(0,p); mctx.lineTo(W,p); mctx.stroke();
  }

  mctx.fillStyle = 'rgba(150,142,128,0.62)';
  for (const r of rocks){
    mctx.beginPath();
    mctx.arc(tx(r.x), tz(r.z), Math.max(1.6, r.r*k*0.85), 0, TAU);
    mctx.fill();
  }

  for (const f of foods){
    mctx.fillStyle = f.rare ? 'rgba(90,235,255,0.98)' : 'rgba(255,205,90,0.92)';
    mctx.beginPath();
    mctx.arc(tx(f.x), tz(f.z), (f.rare ? 2.6 : 1.8) * S, 0, TAU);
    mctx.fill();
  }

  for (const s of snakes){
    if (!s.alive) continue;
    const isP = s.isPlayer;
    mctx.strokeStyle = isP ? 'rgba(120,255,180,0.95)' : 'rgba(255,105,105,0.72)';
    mctx.lineWidth = (isP ? 3.2 : 2.0) * S;
    mctx.lineJoin = 'round';
    mctx.lineCap = 'round';
    mctx.beginPath();
    let first = true;
    for (let j=0;j<s.segCount;j+=2){
      const X = tx(s.segX[j]), Y = tz(s.segZ[j]);
      if (first){ mctx.moveTo(X,Y); first = false; }
      else mctx.lineTo(X,Y);
    }
    mctx.stroke();

    const hx = tx(s.headPos.x), hz = tz(s.headPos.z);
    const grd = mctx.createRadialGradient(hx, hz, 0, hx, hz, 9*S);
    grd.addColorStop(0, isP ? 'rgba(180,255,215,0.95)' : 'rgba(255,170,170,0.8)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    mctx.fillStyle = grd;
    mctx.beginPath(); mctx.arc(hx, hz, 9*S, 0, TAU); mctx.fill();

    mctx.fillStyle = isP ? '#dcffe9' : '#ffc9c9';
    mctx.beginPath();
    mctx.arc(hx, hz, (isP ? 4.0 : 2.8)*S, 0, TAU);
    mctx.fill();

    if (isP){
      const fx = Math.sin(s.yaw), fz = Math.cos(s.yaw);
      mctx.strokeStyle = 'rgba(210,255,230,0.9)';
      mctx.lineWidth = 1.8*S;
      mctx.beginPath();
      mctx.moveTo(hx, hz);
      mctx.lineTo(tx(s.headPos.x + fx*18), tz(s.headPos.z + fz*18));
      mctx.stroke();

      // View cone (shows camera direction)
      const camFx = Math.sin(camYaw), camFz = Math.cos(camYaw);
      mctx.strokeStyle = 'rgba(140,220,255,0.45)';
      mctx.lineWidth = 1.4*S;
      mctx.beginPath();
      mctx.moveTo(hx, hz);
      mctx.lineTo(tx(s.headPos.x + camFx*22), tz(s.headPos.z + camFz*22));
      mctx.stroke();
    }
  }

  mctx.strokeStyle = 'rgba(120,200,255,0.42)';
  mctx.lineWidth = 2*S;
  mctx.strokeRect(1*S, 1*S, W-2*S, H-2*S);
}

/* ============================================================
   17 · HUD
   ============================================================ */
let hudAcc = 0;
function updateHUD(){
  if (!player) return;
  scoreEl.textContent = score;
  lenEl.textContent = Math.round(player.length) + ' m';

  if (player.boosting && boostEnergy > 0.5){
    spdEl.textContent = 'BOOST';
    spdEl.classList.add('boost');
  } else {
    spdEl.textContent = Math.round(player.speed);
    spdEl.classList.remove('boost');
  }

  const aliveAI = snakes.reduce((n, s) => n + ((s !== player && s.alive) ? 1 : 0), 0);
  huntEl.textContent = aliveAI;
  huntEl.classList.toggle('warn', aliveAI >= 6);

  const bp = boostEnergy / BOOST_MAX * 100;
  boostFill.style.width = bp.toFixed(1) + '%';
  boostFill.classList.toggle('low', boostEnergy < 25);

  if (boostEnergy <= 0.5) boostEl.classList.add('disabled');
  else boostEl.classList.remove('disabled');

  const dx = Math.abs(player.headPos.x), dz = Math.abs(player.headPos.z);
  const dEdge = CFG.arenaHalf - Math.max(dx, dz);
  const danger = clamp(1 - dEdge / 26, 0, 1);
  dangerRing.style.opacity = (danger * 0.75).toFixed(2);
}

/* ============================================================
   18 · MAIN LOOP
   ============================================================ */
let lastT = performance.now();

function animate(now){
  requestAnimationFrame(animate);

  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = Math.min(dt, 0.05);

  if (hitStop > 0){
    hitStop -= dt;
    dt *= 0.25;
  }

  clockTime += dt;

  if (state === 'playing'){
    player.steer = clamp(keySteer() + touchSteer, -1, 1);

    const wantsBoost = keyBoost() || touchBoost;
    if (wantsBoost && boostEnergy > 0.5){
      if (!player.boosting) Sfx.boost();
      player.boosting = true;
      boostEnergy = Math.max(0, boostEnergy - BOOST_DRAIN * dt);

      const back = player.headRadius * 2.4;
      const bx = player.headPos.x - Math.sin(player.yaw) * back;
      const bz = player.headPos.z - Math.cos(player.yaw) * back;
      for (let i=0;i<2;i++){
        particles.spawn(
          bx + rand(-1.4,1.4), rand(0.4,1.6), bz + rand(-1.4,1.4),
          rand(-2.5,2.5), rand(1.6,4.0), rand(-2.5,2.5),
          0.90, 0.74, 0.55,
          rand(0.35,0.75), rand(1.0,1.8), 5
        );
      }
    } else {
      player.boosting = false;
    }
    if (!wantsBoost) boostEnergy = Math.min(BOOST_MAX, boostEnergy + BOOST_REGEN * dt);

    player.update(dt, clockTime);

    for (const s of snakes){
      if (s === player || !s.alive) continue;
      updateAI(s, dt, clockTime, snakes);
      s.update(dt, clockTime);
    }

    for (const s of snakes){
      if (!s.alive) continue;
      checkFood(s, s === player);
    }

    checkCollisions();
    updateSpawner(dt);

    if (comboTimer > 0){
      comboTimer -= dt;
      if (comboTimer <= 0){
        combo = 0;
        comboWrap.classList.remove('on');
      }
    }

    updateCamera(dt);

    hudAcc += dt;
    if (hudAcc > 0.05){ updateHUD(); hudAcc = 0; }

    if (dangerRing.style.opacity > 0.5 && Math.random() < 0.05){
      shake = Math.max(shake, 0.05);
    }
  }
  else if (state === 'menu'){
    const t = clockTime * 0.14;
    const r = 108;
    camera.position.set(Math.sin(t)*r, 56 + Math.sin(t*0.7)*6, Math.cos(t)*r);
    camera.lookAt(0, 2, 0);
    camera.fov = 62;
    camera.updateProjectionMatrix();
    camInit = false;
  }
  else if (state === 'paused'){ /* freeze */ }
  else if (state === 'dying'){
    deathTimer -= dt;
    const t = clockTime * 0.9;
    const r = 34;
    if (player){
      camera.position.set(
        player.headPos.x + Math.sin(t)*r, 20,
        player.headPos.z + Math.cos(t)*r
      );
      camera.lookAt(player.headPos.x, 2, player.headPos.z);
    }
    if (deathTimer <= 0) showDeathPanel();
  }
  else if (state === 'dead'){
    const t = clockTime * 0.35;
    const r = 40;
    if (player){
      camera.position.set(
        player.headPos.x + Math.sin(t)*r, 22,
        player.headPos.z + Math.cos(t)*r
      );
      camera.lookAt(player.headPos.x, 2, player.headPos.z);
    }
  }

  // Camera shake
  if (shake > 0){
    shake = Math.max(0, shake - dt*2.6);
    const m = shake * 1.5;
    camera.position.x += (Math.random()-0.5)*m;
    camera.position.y += (Math.random()-0.5)*m;
    camera.position.z += (Math.random()-0.5)*m;
  }

  // Sun follows player
  if (player){
    const cx = player.headPos.x, cz = player.headPos.z;
    sun.position.set(cx + SUN_OFFSET.x, SUN_OFFSET.y, cz + SUN_OFFSET.z);
    sun.target.position.set(cx, 0, cz);
    sun.target.updateMatrixWorld();
  }

  skyDome.position.copy(camera.position);

  particles.update(dt);
  syncFoodInstances(clockTime);

  // Camera look auto-decay
  if (activeLook.id === null){
    if (lookDecayDelay > 0){
      lookDecayDelay -= dt;
    } else {
      const decay = Math.exp(-dt * 0.9);
      camOffsetYaw *= decay;
      camOffsetPitch *= decay;
    }
  }

  // Dead-snake cleanup
  for (let i=snakes.length-1; i>=0; i--){
    const s = snakes[i];
    if (s === player) continue;
    if (!s.alive){
      s.deadTime += dt;
      if (s.deadTime > 3){
        s.dispose();
        snakes.splice(i, 1);
      }
    }
  }

  drawMinimap();
  composer.render();
}

/* ============================================================
   19 · RESIZE
   ============================================================ */
function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const pr = Math.min(window.devicePixelRatio, IS_MOBILE ? 1.75 : 2);
  renderer.setSize(w, h);
  renderer.setPixelRatio(pr);
  composer.setSize(w, h);
  composer.setPixelRatio(pr);
  bloom.setSize(w, h);
  sizeMinimap();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', ()=> setTimeout(onResize, 140));

/* ============================================================
   20 · BOOT
   ============================================================ */
buildWorld();
resetGame();

ovRows.innerHTML = `
  <div class="row"><span>ARENA</span><b>${CFG.arenaHalf*2} × ${CFG.arenaHalf*2} m</b></div>
  <div class="row"><span>STARTING HUNTERS</span><b>${CFG.startAI}</b></div>
  <div class="row"><span>MAX HUNTERS</span><b>${CFG.maxAI}</b></div>
  <div class="row"><span>BEST SCORE</span><b>${best}</b></div>
`;
startBtn.textContent = 'START';

sizeMinimap();
requestAnimationFrame(animate);
</script>
